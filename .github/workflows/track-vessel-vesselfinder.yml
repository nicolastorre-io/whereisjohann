name: Track Vessel Position (VesselFinder)

on:
  schedule:
    - cron: '30 * * * *'  # Every hour at :30 (offset from AISStream)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Build
        run: yarn workspace shared build && yarn workspace backend build

      - name: Get vessel position from VesselFinder
        env:
          MMSI: ${{ vars.MMSI }}
        run: yarn track:vesselfinder

      - name: Commit and push position
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/public/position.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "[POSITION] Update vessel position (VesselFinder)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy-pages.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
